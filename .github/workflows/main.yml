name: Breaking Bharat AI Automation

on:
  schedule:
    # Run every 1 hour at minute 17
    # Using minute 17 helps avoid the heavy load around :00
    - cron: '17 * * * *'

  # Allows you to run the workflow manually from GitHub Actions
  workflow_dispatch:

jobs:
  run-news-bot:
    runs-on: ubuntu-latest

    # Prevent a single run from running indefinitely
    timeout-minutes: 30

    # Prevent overlapping runs
    concurrency:
      group: breaking-bharat-news-automation
      cancel-in-progress: false

    steps:

      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP PYTHON
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ==========================================
      # 3. INSTALL DEPENDENCIES
      # ==========================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================
      # 4. TEST WORDPRESS CONNECTION
      # ==========================================
      - name: Test WordPress Connection
        run: |
          python - <<'PY'
          import requests

          url = "https://breakingbharat24.com/wp-json/wp/v2/posts?per_page=1"

          try:
              response = requests.get(url, timeout=30)

              print("WordPress Status:", response.status_code)

              if response.status_code == 200:
                  print("WordPress Connection: OK")
              else:
                  print("WordPress Connection returned:", response.status_code)

          except Exception as e:
              print("WordPress Connection Error:", e)
              raise
          PY


      # ==========================================
      # 5. RUN BREAKING BHARAT AUTOMATION
      # ==========================================
      - name: Run Automation
        env:

          # ----------------------------------------
          # GROQ
          # ----------------------------------------
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          # ----------------------------------------
          # HUGGING FACE
          # ----------------------------------------
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

          # ----------------------------------------
          # NEWSDATA
          # ----------------------------------------
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}

          # ----------------------------------------
          # WORDPRESS
          # ----------------------------------------
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}

          # ----------------------------------------
          # AUTOMATION SETTINGS
          # ----------------------------------------
          MAX_NEWS_PER_RUN: "8"
          REQUEST_DELAY: "10"

        run: |
          python app.py
