name: Breaking Bharat AI Automation

on:
  schedule:
    # Run every 1 hour
    - cron: '0 * * * *'

  workflow_dispatch:

jobs:
  run-news-bot:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test WordPress Connection
        run: |
          python -c "import requests; r=requests.get('https://breakingbharat24.com/wp-json/wp/v2/posts?per_page=1', timeout=30); print('WordPress Status:', r.status_code); print('Connection OK')"

   
      - name: Run Automation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}

          # Custom Configuration
          MAX_NEWS_PER_RUN: "8"
          REQUEST_DELAY: "10"

        run: |
          python app.py
